<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEP Finder Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root{
    --cor-principal:#4a525e;
    --cor-secundaria:#d3d3d3;
}

body{
    background:linear-gradient(135deg,var(--cor-principal),var(--cor-secundaria));
    min-height:100vh;
    transition:.4s;
}

.card{
    border:none;
    border-radius:20px;
    backdrop-filter:blur(10px);
    animation:fadeIn .6s;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.dark-mode{
    background:#121212 !important;
}

.dark-mode .card{
    background:#1e1e1e;
    color:white;
}

pre{
    max-height:250px;
    overflow:auto;
    border-radius:10px;
}

</style>

</head>
<body>

<div class="container py-5">

    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-dark" onclick="alternarTema()">
            <i class="bi bi-moon-stars"></i>
        </button>
    </div>

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white text-center">
            <h2>
                <i class="bi bi-geo-alt-fill"></i>
                CEP Finder Pro
            </h2>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>CEP</label>

                    <input
                        type="text"
                        id="cep"
                        class="form-control"
                        placeholder="Digite o CEP"
                        maxlength="9"
                    >
                </div>

                <div class="col-md-2 mb-3 d-flex align-items-end">

                    <button
                        class="btn btn-primary w-100"
                        onclick="buscarCEP()">

                        Buscar

                    </button>

                </div>

                <div class="col-md-2 mb-3 d-flex align-items-end">

                    <button
                        class="btn btn-danger w-100"
                        onclick="limparCampos()">

                        Limpar

                    </button>

                </div>

            </div>

            <div class="row">

                <div class="col-md-8 mb-3">
                    <label>Logradouro</label>
                    <input type="text" id="logradouro" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Bairro</label>
                    <input type="text" id="bairro" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Cidade</label>
                    <input type="text" id="cidade" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>UF</label>
                    <input type="text" id="uf" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>DDD</label>
                    <input type="text" id="ddd" class="form-control">
                </div>

            </div>

            <hr>

            <h5>Resposta da API</h5>

            <pre class="bg-dark text-light p-3" id="json">
Aguardando consulta...
            </pre>

        </div>

    </div>

</div>

<script>

const cepInput = document.getElementById("cep");

cepInput.addEventListener("input", () => {

    let valor = cepInput.value
        .replace(/\D/g,"")
        .replace(/^(\d{5})(\d)/,"$1-$2");

    cepInput.value = valor;

});

async function buscarCEP(){

    let cep = cepInput.value.replace(/\D/g,'');

    if(cep.length !== 8){

        alert("CEP inválido");
        return;

    }

    try{

        let resposta =
        await fetch(`https://viacep.com.br/ws/${cep}/json/`);

        let dados = await resposta.json();

        if(dados.erro){

            alert("CEP não encontrado");
            return;

        }

        document.getElementById("logradouro").value = dados.logradouro || "";
        document.getElementById("bairro").value = dados.bairro || "";
        document.getElementById("cidade").value = dados.localidade || "";
        document.getElementById("uf").value = dados.uf || "";
        document.getElementById("ddd").value = dados.ddd || "";

        document.getElementById("json")
        .textContent = JSON.stringify(dados,null,4);

    }
    catch(erro){

        alert("Erro ao consultar.");

    }

}

function limparCampos(){

    document.querySelectorAll("input").forEach(
        campo => campo.value = ""
    );

    document.getElementById("json")
    .textContent = "Aguardando consulta...";

}

function alternarTema(){

    document.body.classList.toggle("dark-mode");

}

</script>

</body>
</html>
