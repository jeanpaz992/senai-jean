<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
    .bgfull {
        background-color:#000000;
        width: 100%;
        height: 100vh;
        margin-top: 200px;
        background-image: url('img/metiflix.jpg');
        background-size: cover;
        background-position:center;
        position: all;
        overflow: hidden;
    }

    .bgfull::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 1;
    }

    .bgfulltext {
        color: #b20710;
        font-family: arial, sans-serif; 
        font-size: 16px;
        margin-top: 100px;
        position: relative;
        z-index: 2;
    }

    .bg {
        align-items: center;
        text-align: center;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 2;
    }
    .poster-card{
    overflow:hidden;
    border-radius:10px;
    cursor:pointer;
}

.poster-card img{
    transition:.4s;
    width:100%;
}

.poster-card:hover img{
    transform:scale(1.1);
    box-shadow:0 0 20px #e50914;
}
</style>
<script>
   function login() {
        let usuario = document.getElementById("usuario").value;
        let senha = document.getElementById("senha").value;

        if (usuario == "jean" && senha == "1234") {
            alert("Login bem-sucedido!");
            mostrarHome();
            esconderLogin();
          } else {
            alert("Usuário ou senha incorretos. Tente novamente.");
            return false;
          }
        }

        function logout(){
             esconderHome();
             mostrarLogin();
        }

        function mostrarHome() {
            let telaHome = document.getElementById("home");
            telaHome.style.display = "block";
        }

        function esconderLogin() {
            let telaLogin = document.getElementById("login");
            telaLogin.style.display = "none";
        }

        function esconderHome() {
            let telaHome = document.getElementById("home");
            telaHome.style.display = "none";
        }
        function mostrarLogin() {
            let telaLogin = document.getElementById("login");
            telaLogin.style.display = "block";
        }

        function mostrarSenha() {
            let campoSenha = document.getElementById("senha");
            if (campoSenha.type === "password") {
                campoSenha.type = "text";
            } else {
                campoSenha.type = "password";
            }
        }

        document.addEventListener("keypress", function(event){
            if(event.key === "Enter"){
                login();
            }
        });
        async function carregarGaleria(){

    const apiKey = "SUA_API_KEY";

    const resposta = await fetch(
        `https://www.omdbapi.com/?apikey=${apiKey}&s=marvel`
    );

    const dados = await resposta.json();

    let html = "";

    dados.Search.forEach(filme => {

        html += `
        <div class="col-md-2 mb-4">

            <div class="poster-card">

                <img
                    src="${filme.Poster}"
                    class="img-fluid rounded">

            </div>

        </div>
        `;

    });

    document.getElementById("galeria").innerHTML = html;

}

carregarGaleria();
        
</script>
<body class="bgfull">
    <section class="bg" id="login">
        <div class="logo-metiflix">
    <svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="100" rx="15" fill="#000"/>
        <circle cx="55" cy="50" r="28" fill="#b20710"/>
        <polygon points="48,35 48,65 72,50" fill="white"/>
        <text x="100" y="62"
              font-family="Arial, sans-serif"
              font-size="36"
              font-weight="bold"
              fill="#b20710">
            METIFLIX
        </text>
    </svg>
</div>
        <input id="usuario" type="text" placeholder="Digite o usuario" ><br><br>
        <input id="senha" type="password" placeholder="Digite a senha">
        <button onclick="mostrarSenha()">👁</button>
        <br><br>
        <input type="button" value="Entrar" onclick="login()" ><br><br>
    </section>
    <section class="bg" id="home" style="display: none;">
        <h1 class="bgfulltext">Bem-vindo à Metiflix!</h1>
        <button onclick="logout()">Sair</button> <br><br><br>
        <div class="container mt-5">

    <h2 class="text-white mb-4">🎬 Filmes em Destaque</h2>

    <div class="row g-4">

        <div class="col-md-2 col-sm-4 col-6">
            <div class="poster-card">
                <img src="https://image.tmdb.org/t/p/w500/qNBAXBIQlnOThrVvA6mA2B5ggV6.jpg"
                     class="img-fluid rounded">
            </div>
        </div>

        <div class="col-md-2 col-sm-4 col-6">
            <div class="poster-card">
                <img src="https://image.tmdb.org/t/p/w500/8YFL5QQVPy3AgrEQxNYVSgiPEbe.jpg"
                     class="img-fluid rounded">
            </div>
        </div>

        <div class="col-md-2 col-sm-4 col-6">
            <div class="poster-card">
                <img src="https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg"
                     class="img-fluid rounded">
            </div>
        </div>

        <div class="col-md-2 col-sm-4 col-6">
            <div class="poster-card">
                <img src="https://image.tmdb.org/t/p/w500/rAiYTfKGqDCRIIqo664sY9XZIvQ.jpg"
                     class="img-fluid rounded">
            </div>
        </div>

        <div class="col-md-2 col-sm-4 col-6">
            <div class="poster-card">
                <img src="https://image.tmdb.org/t/p/w500/6KErczPBROQty7QoIsaa6wJYXZi.jpg"
                     class="img-fluid rounded">
            </div>
        </div>

        <div class="col-md-2 col-sm-4 col-6">
            <div class="poster-card">
                <img src="https://image.tmdb.org/t/p/w500/9Gtg2DzBhmYamXBS1hKAhiwbBKS.jpg"
                     class="img-fluid rounded">
            </div>
        </div>

    </div>

</div>
        </section>

</body>
</html>
