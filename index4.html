<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
    .bgfull {
        background-color:#000000;
        width: 100%;
        height: 100vh;
        margin-top: 200px;
        background-image: url('img/metiflix.jpg');
        background-size: cover;
        background-position:center;
        position: all;
        overflow: hidden;
    }

    .bgfull::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 1;
    }

    .bgfulltext {
        color: #b20710;
        font-family: arial, sans-serif; 
        font-size: 16px;
        margin-top: 100px;
        position: relative;
        z-index: 2;
    }

    .bg {
        align-items: center;
        text-align: center;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 2;
    }
</style>
<script>
   function login() {
        let usuario = document.getElementById("usuario").value;
        let senha = document.getElementById("senha").value;

        if (usuario == "jean" && senha == "1234") {
            alert("Login bem-sucedido!");
            mostrarHome();
            esconderLogin();
          } else {
            alert("Usuário ou senha incorretos. Tente novamente.");
            return false;
          }
        }

        function logout(){
             esconderHome();
             mostrarLogin();
        }

        function mostrarHome() {
            let telaHome = document.getElementById("home");
            telaHome.style.display = "block";
        }

        function esconderLogin() {
            let telaLogin = document.getElementById("login");
            telaLogin.style.display = "none";
        }

        function esconderHome() {
            let telaHome = document.getElementById("home");
            telaHome.style.display = "none";
        }
        function mostrarLogin() {
            let telaLogin = document.getElementById("login");
            telaLogin.style.display = "block";
        }

        
</script>
<body class="bgfull">
    <section class="bg" id="login">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-collection-play-fill" viewBox="0 0 16 16">
  <path d="M2.5 3.5a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1zm2-2a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1zM0 13a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 16 13V6a1.5 1.5 0 0 0-1.5-1.5h-13A1.5 1.5 0 0 0 0 6zm6.258-6.437a.5.5 0 0 1 .507.013l4 2.5a.5.5 0 0 1 0 .848l-4 2.5A.5.5 0 0 1 6 12V7a.5.5 0 0 1 .258-.437"/>
</svg>
        <div><h1 style="font-family: arial, sans-serif; font-size: 16px; color: #b20710;">METIFLIX</h1><div>
        <input id="usuario" type="text" placeholder="Digite o usuario" ><br><br>
        <input id="senha" type="password" placeholder="Digite a senha" ><br><br>
        <input type="button" value="Entrar" onclick="login()" ><br><br>
    </section>

    <section class="bg" id="home" style="display: none;"> 
        <div class="bgfulltext"> <H1>BEM VINDO A METIFLIX</H1></div>
      <input type="button" value="Logout" onclick="logout()"><br>
    </section>

</body>
</html>
